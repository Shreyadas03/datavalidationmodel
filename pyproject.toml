[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dq-platform"
version = "0.1.0"
description = "Excel data quality reporting platform with an interactive Jupyter UI"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0",
    "xlrd>=2.0.1",
    "openpyxl>=3.1",
    "XlsxWriter>=3.1",
    "ipywidgets>=8.1",
    "phonenumbers>=8.13",
    "Jinja2>=3.1",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "jupyterlab>=4.0", "ipykernel>=6.29"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dq_platform = ["report/templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
